# DriftDB service for real-time collaboration
services:
  driftdb:
    build:
      context: ./driftdb
      dockerfile: Dockerfile.server
    ports:
      - "8080:8080"
    environment:
      - PORT=8080
    command: ["driftdb-server", "--port", "8080", "--host", "0.0.0.0"]
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:8080/ || curl -f http://localhost:8080/new || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 10s